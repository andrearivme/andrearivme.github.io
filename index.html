   :root {
  --bg: #e6d3b3;

  --prompt-color: #6b4f4f;
  --accent: #9c6b30;
  --green: #556b2f;
  --yellow: #a67c52;
  --red: #8b3a3a;
  --magenta: #704214;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  font-family: 'Courier New', Courier, monospace;
  font-size: 14px;
  color: var(--text);
  overflow: hidden;
}

/* CRT scanlines */
body::before {
  content: '';
  display: block;
  position: fixed;
  inset: 0;
  background:
    linear-gradient(
      rgba(255,255,255,0) 50%,
      rgba(90,70,40,0.08) 50%
    ),
    linear-gradient(
      90deg,
      rgba(120,90,60,0.02),
      rgba(140,110,80,0.015),
      rgba(100,80,60,0.02)
    );
  background-size: 100% 2px, 3px 100%;
  z-index: 10;
  pointer-events: none;
}

/* CRT flicker */
body::after {
  content: '';
  display: block;
  position: fixed;
  inset: 0;
  background: rgba(90,70,40,0.03);
  opacity: 0;
  z-index: 10;
  pointer-events: none;
  animation: flicker 0.18s infinite;
}

@keyframes flicker {
  0%   { opacity: 0.15; }
  20%  { opacity: 0.12; }
  50%  { opacity: 0.18; }
  80%  { opacity: 0.10; }
  100% { opacity: 0.15; }
}

@keyframes blink {
  to { opacity: 0; }
}

#screen {
  position: absolute;
  top: 60px;
  left: 70px;
  right: 70px;
  bottom: 60px;
  overflow-y: auto;
  overflow-x: hidden;
  line-height: 1.75;
  scrollbar-width: none;
}

#screen::-webkit-scrollbar {
  display: none;
}

.line {
  word-break: break-word;
  white-space: pre-wrap;
}

.cmd::before {
  content: '# ';
  color: var(--prompt-color);
}

.output {
  color: var(--text);
  white-space: pre-wrap;
}

.input-line {
  display: flex;
  align-items: baseline;
}

.input-line::before {
  content: '# ';
  color: var(--prompt-color);
  flex-shrink: 0;
}

#input-text {
  outline: none;
  min-width: 2px;
  word-break: break-all;
}

#cursor {
  display: inline-block;
  width: 8px;
  height: 14px;
  background: var(--prompt-color);
  box-shadow:
    0 0 8px var(--prompt-color),
    0 0 2px #fff;
  vertical-align: middle;
  animation: blink 1s steps(2, start) infinite;
  margin-left: 1px;
}

.c-comment  { color: var(--comment); }
.c-hl       { color: var(--highlight); font-weight: bold; }
.c-accent   { color: var(--accent); }
.c-green    { color: var(--green); }
.c-yellow   { color: var(--yellow); }
.c-red      { color: var(--red); }
.c-magenta  { color: var(--magenta); }
.c-prompt   { color: var(--prompt-color); }

a {
  color: var(--accent);
  text-decoration: none;
  cursor: pointer;
}

a:hover {
  background: var(--text);
  color: var(--bg);
}

a[data-cmd]:hover {
  background: var(--prompt-color);
  color: var(--bg);
}

footer {
  position: fixed;
  bottom: 15px;
  right: 20px;
  color: var(--comment);
  font-size: 13px;
  z-index: 5;
}

footer a {
  color: var(--comment);
}

footer a:hover {
  color: var(--bg);
  background: var(--comment);
}

/* mobile */
@media (max-width: 600px) {
  #screen {
    top: 30px;
    left: 20px;
    right: 20px;
    bottom: 45px;

  footer {

    }
  </style>

const screen   = document.getElementById('screen');
const inputEl  = document.getElementById('input-text');
const cursorEl = document.getElementById('cursor');
let history = [], histIdx = -1;

function getInputLine() {
  return screen.querySelector('.input-line');
}

function write(html, isCmd = false) {
  const il = getInputLine();
  const div = document.createElement('div');
  div.className = 'line' + (isCmd ? ' cmd' : '');
  div.innerHTML = html;
  screen.insertBefore(div, il);
  scrollBottom();
}

function scrollBottom() {
  screen.scrollTop = screen.scrollHeight;
}

function clear() {
  const il = getInputLine();
  [...screen.querySelectorAll('.line')].forEach(l => l.remove());
  scrollBottom();
}

function process(raw) {
  const cmd = raw.trim();
  if (!cmd) return;

  write(`${escHtml(cmd)}`, true);
  history.unshift(cmd);
  histIdx = -1;

  const parts = cmd.split(/\s+/);
  const base  = parts[0].toLowerCase();
  const arg   = parts.slice(1).join(' ');

  if (base === 'clear') { clear(); return; }

  if (base === 'whoami') {
    write(`<span class="c-hl">ANDREARIVM_PORTAFOLIO</span>
   usuario    → visitante
   sistema    → Andrea Valeria Rivera Mendoza
   rol        → Analista de Ciberseguridad
              → Analista de Desarrollo y Proyectos
   ubicación  → Monterrey, Nuevo León
   timestamp  → ${new Date().toLocaleString('es-MX')}`);
    return;
  }

  if (base === 'ls') {
    const names = Object.keys(FILES);
    const linked = names.map(n =>
      `<a data-cmd="cat ${n}">${n}</a>`
    ).join('   ');
    write(linked);
    return;
  }

  if (base === 'cat') {
    if (!arg) { write('<span class="c-red">cat: falta el nombre del archivo</span>'); return; }
    if (FILES[arg]) {
      write(`<span class="c-comment">// ${arg} ─────────────────────────────────────────</span>`);
      write(`<span class="output">${FILES[arg]}</span>`);
    } else {
      write(`<span class="c-red">cat: ${escHtml(arg)}: No such file or directory</span>`);
    }
    return;
  }

  if (base === 'help' || base === '?') {
    write(`<span class="output">${FILES.help}</span>`);
    return;
  }

  if (base === 'sudo') {
    write(`<span class="c-red">visitante is not in the sudoers file. This incident will be reported.</span>`);
    return;
  }

  write(`<span class="c-red">comando no encontrado: ${escHtml(base)}</span> — escribe <a data-cmd="help">help</a> para ver los disponibles`);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ─── TECLADO ────────────────────────────────────────────── */
// Usamos un buffer propio para evitar que el browser colapse espacios en innerText
let buf = [];

function renderBuf() {
  // Usamos &nbsp; para espacios para que no se colapsen
  inputEl.innerHTML = buf.map(c => c === ' ' ? '&nbsp;' : escHtml(c)).join('');
  scrollBottom();
}

function getBufText() {
  return buf.join('');
}

document.addEventListener('keydown', e => {
  const k = e.key;

  // Siempre prevenir el scroll con espacio
  if (k === ' ') {
    e.preventDefault();
    buf.push(' ');
    renderBuf();
    return;
  }

  if (k === 'Enter') {
    e.preventDefault();
    const cmd = getBufText();
    buf = [];
    renderBuf();
    process(cmd);
    return;
  }

  if (k === 'Backspace') {
    e.preventDefault();
    buf.pop();
    renderBuf();
    return;
  }

  if (k === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < history.length - 1) histIdx++;
    buf = (history[histIdx] ?? '').split('');
    renderBuf();
    return;
  }

  if (k === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) histIdx--;
    else { histIdx = -1; buf = []; renderBuf(); return; }
    buf = (history[histIdx] ?? '').split('');
    renderBuf();
    return;
  }

  if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    buf.push(k);
    renderBuf();
  }
});

/* ─── CLICS EN LINKS ─────────────────────────────────────── */
screen.addEventListener('click', e => {
  const a = e.target.closest('a[data-cmd]');
  if (a) {
    e.preventDefault();
    const cmd = a.dataset.cmd;
    buf = []; renderBuf();
    process(cmd);
  }
});

/* ─── INICIO ─────────────────────────────────────────────── */
function boot() {
  write(`<span class="c-comment">// ANDREARIVM_PORTAFOLIO //</span>
<span class="c-hl">ANDREA RIVERA</span>
<span class="c-accent">Analista de Ciberseguridad | Analista de Desarrollo y Proyectos</span>

<span class="c-comment">Escribe <a data-cmd="help">help</a> para ver los comandos disponibles.</span>`);

  // auto-run ls y cat perfil
  setTimeout(() => {
    buf = 'ls'.split(''); renderBuf();
    setTimeout(() => {
      process('ls'); buf = []; renderBuf();
      setTimeout(() => {
        buf = 'cat perfil'.split(''); renderBuf();
        setTimeout(() => {
          process('cat perfil'); buf = []; renderBuf();
        }, 400);
      }, 300);
    }, 400);
  }, 300);
}

boot();
</script>
